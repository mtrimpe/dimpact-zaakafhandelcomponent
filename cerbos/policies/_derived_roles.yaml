---
apiVersion: "api.cerbos.dev/v1"
derivedRoles:
  name: zac_roles
  definitions:
    - name: behandelaar
      parentRoles: ["user"]
      condition:
        match:
          expr: '"behandelaar" in request.principal.attr.rollen'

    - name: raadpleger
      parentRoles: ["user"]
      condition:
        match:
          expr: '"raadpleger" in request.principal.attr.rollen'

    - name: coordinator
      parentRoles: ["user"]
      condition:
        match:
          expr: '"coordinator" in request.principal.attr.rollen'

    - name: recordmanager
      parentRoles: ["user"]
      condition:
        match:
          expr: '"recordmanager" in request.principal.attr.rollen'

    - name: beheerder
      parentRoles: ["user"]
      condition:
        match:
          expr: '"beheerder" in request.principal.attr.rollen'
