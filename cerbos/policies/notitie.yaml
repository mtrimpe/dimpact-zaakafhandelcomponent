---
apiVersion: "api.cerbos.dev/v1"
resourcePolicy:
  version: "default"
  importDerivedRoles:
    - zac_roles
  resource: "zaakNotitie"

  rules:
    # lezen
    - actions: ["lezen"]
      effect: EFFECT_ALLOW
      derivedRoles: ["raadpleger"]

    # wijzigen
    - actions: ["wijzigen"]
      effect: EFFECT_ALLOW
      derivedRoles: ["behandelaar"]
