---
apiVersion: "api.cerbos.dev/v1"
resourcePolicy:
  version: "default"
  importDerivedRoles:
    - zac_roles
  resource: "taak"

  variables:
    local:
      zaaktype_allowed: >-
        !has(request.principal.attr.zaaktypen) ||
        request.resource.attr.zaaktype in request.principal.attr.zaaktypen
      open: "request.resource.attr.open == true"

  rules:
    # lezen
    - actions: ["lezen"]
      effect: EFFECT_ALLOW
      derivedRoles: ["raadpleger"]
      condition:
        match:
          expr: V.zaaktype_allowed

    # wijzigen
    - actions: ["wijzigen"]
      effect: EFFECT_ALLOW
      derivedRoles: ["behandelaar"]
      condition:
        match:
          all:
            of:
              - expr: V.zaaktype_allowed
              - expr: V.open

    # toekennen
    - actions: ["toekennen"]
      effect: EFFECT_ALLOW
      derivedRoles: ["behandelaar"]
      condition:
        match:
          all:
            of:
              - expr: V.zaaktype_allowed
              - expr: V.open

    # creeren_document, toevoegen_document
    - actions: ["creeren_document", "toevoegen_document"]
      effect: EFFECT_ALLOW
      derivedRoles: ["behandelaar"]
      condition:
        match:
          all:
            of:
              - expr: V.zaaktype_allowed
              - expr: V.open
